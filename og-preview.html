<!doctype html>
<!-- Временный файл для генерации og-image.png (1200×630) через headless Chrome.
     После генерации можно удалить. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(160deg, #fff9f0 0%, #ffd93d 55%, #ff9a3d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Comfortaa', sans-serif;
    color: #4a3f35;
    position: relative;
    overflow: hidden;
  }
  .emoji { position: absolute; font-size: 90px; }
  .invite {
    font-family: 'Pacifico', cursive;
    font-size: 110px;
    color: #ff6b6b;
    text-shadow: 0 5px 0 rgba(255, 255, 255, 0.65);
  }
  .sub {
    font-size: 42px;
    font-weight: 700;
    margin-top: 30px;
    background: rgba(255, 255, 255, 0.75);
    padding: 14px 40px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <span class="emoji" style="top:50px;left:90px">🎈</span>
  <span class="emoji" style="top:80px;right:110px">🎈</span>
  <span class="emoji" style="bottom:70px;left:190px">🎉</span>
  <span class="emoji" style="bottom:55px;right:210px">🎂</span>
  <span class="emoji" style="top:290px;left:55px;font-size:64px">🎁</span>
  <span class="emoji" style="top:330px;right:65px;font-size:64px">⭐</span>
  <span class="emoji" style="top:170px;left:330px;font-size:50px">🎈</span>
  <span class="emoji" style="bottom:200px;right:380px;font-size:50px">🎉</span>

  <div class="invite">День рождения!</div>
  <div class="sub">Приглашаем на праздник 🎈</div>
</body>
</html>
