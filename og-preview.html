<!doctype html>
<!-- Временный файл для генерации og-image.png (1200×630) через headless Chrome.
     После генерации можно удалить. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(160deg, #ffe29a 0%, #ffb37a 45%, #ff8e8e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Comfortaa', sans-serif;
    color: #4a3f35;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .balloon { position: absolute; }
  .invite {
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .name {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 150px;
    line-height: 1.15;
    color: #ffffff;
    text-shadow: 0 4px 0 rgba(214, 90, 90, 0.55), 0 10px 30px rgba(74, 63, 53, 0.25);
    margin: 10px 0 18px;
  }
  .age {
    display: inline-block;
    font-weight: 700;
    font-size: 64px;
    background: #ffd93d;
    border-radius: 999px;
    padding: 0.1em 0.7em;
    box-shadow: 0 10px 30px rgba(74, 63, 53, 0.12);
    transform: rotate(-3deg);
  }
</style>
</head>
<body>
  <!-- Шарики — та же SVG-разметка, что генерирует script.js в hero -->
  <div class="balloon" style="top:60px;left:110px;transform:scale(1.05);opacity:0.85">
    <svg viewBox="0 0 60 100" width="60" height="100">
      <ellipse cx="30" cy="30" rx="26" ry="30" fill="#ff6b6b"/>
      <ellipse cx="22" cy="20" rx="8" ry="10" fill="rgba(255,255,255,0.35)"/>
      <polygon points="30,60 25,68 35,68" fill="#ff6b6b"/>
      <path d="M30 68 q7 12 -3 30" stroke="rgba(74,63,53,0.4)" stroke-width="1.5" fill="none"/>
    </svg>
  </div>
  <div class="balloon" style="top:90px;right:130px;transform:scale(0.9);opacity:0.8">
    <svg viewBox="0 0 60 100" width="60" height="100">
      <ellipse cx="30" cy="30" rx="26" ry="30" fill="#4ecdc4"/>
      <ellipse cx="22" cy="20" rx="8" ry="10" fill="rgba(255,255,255,0.35)"/>
      <polygon points="30,60 25,68 35,68" fill="#4ecdc4"/>
      <path d="M30 68 q7 12 -3 30" stroke="rgba(74,63,53,0.4)" stroke-width="1.5" fill="none"/>
    </svg>
  </div>
  <div class="balloon" style="bottom:80px;left:230px;transform:scale(0.7);opacity:0.7">
    <svg viewBox="0 0 60 100" width="60" height="100">
      <ellipse cx="30" cy="30" rx="26" ry="30" fill="#ff9a3d"/>
      <ellipse cx="22" cy="20" rx="8" ry="10" fill="rgba(255,255,255,0.35)"/>
      <polygon points="30,60 25,68 35,68" fill="#ff9a3d"/>
      <path d="M30 68 q7 12 -3 30" stroke="rgba(74,63,53,0.4)" stroke-width="1.5" fill="none"/>
    </svg>
  </div>
  <div class="balloon" style="bottom:110px;right:260px;transform:scale(0.75);opacity:0.75">
    <svg viewBox="0 0 60 100" width="60" height="100">
      <ellipse cx="30" cy="30" rx="26" ry="30" fill="#ffd93d"/>
      <ellipse cx="22" cy="20" rx="8" ry="10" fill="rgba(255,255,255,0.35)"/>
      <polygon points="30,60 25,68 35,68" fill="#ffd93d"/>
      <path d="M30 68 q7 12 -3 30" stroke="rgba(74,63,53,0.4)" stroke-width="1.5" fill="none"/>
    </svg>
  </div>

  <p class="invite">Приглашаем на день рождения</p>
  <h1 class="name">Мирон</h1>
  <div class="age">5 лет</div>
</body>
</html>
