# Деплой на GitHub Pages.
# config.js с приватными данными не лежит в репозитории —
# он создаётся здесь из секрета CONFIG_JS
# (Settings → Secrets and variables → Actions → New repository secret,
#  значение — полное содержимое твоего локального config.js).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум деплоям идти одновременно
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from secret
        env:
          CONFIG_JS: ${{ secrets.CONFIG_JS }}
        # printf '%s' — содержимое секрета не интерпретируется шеллом
        run: printf '%s' "$CONFIG_JS" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
